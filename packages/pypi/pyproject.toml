[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pak-geodata"
version = "0.2.0"
description = "Comprehensive, typed, offline geographic data for all areas and cities in Pakistan"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Sohaib Bin Mohsin", email = "sohaibbinmohsin@gmail.com" },
    { name = "The Mohsin Project Global" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
keywords = [
    "pakistan",
    "geodata",
    "gis",
    "coordinates",
    "provinces",
    "cities",
    "areas",
    "sectors",
    "postal-codes",
    "lahore",
    "karachi",
    "islamabad",
    "rawalpindi",
    "faisalabad",
    "geocoding",
    "reverse-geocoding",
    "haversine",
]

[project.urls]
Homepage = "https://github.com/sohaibbinmohsin/pak-geodata"
Documentation = "https://github.com/sohaibbinmohsin/pak-geodata#readme"
Repository = "https://github.com/sohaibbinmohsin/pak-geodata.git"
"Bug Tracker" = "https://github.com/sohaibbinmohsin/pak-geodata/issues"
"Founder" = "https://sohaibbinmohsin.com"
"Company" = "https://themohsinproject.org"

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pak_geodata*"]

[tool.setuptools.package-data]
pak_geodata = [
    "py.typed",
    "data/*.json",
    "data/**/*.json",
    "data/**/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
