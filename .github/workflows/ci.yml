name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Python 3
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'

      - name: Install dependencies
        run: npm install

      - name: Run production build
        run: npm run build

      - name: Run TypeScript typecheck / lint
        run: npm run lint

      - name: Run test suite
        run: npm test

      - name: Run Python unit tests
        run: python3 -m unittest discover -s packages/pypi/tests -v

      - name: Run Go unit tests
        run: cd packages/go && go test -v ./...

      - name: Run Dart unit tests
        run: cd packages/dart && dart pub get && dart test
